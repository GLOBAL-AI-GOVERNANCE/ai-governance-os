name: Foundations Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read

jobs:
  foundations-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out shared history-privacy control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GLOBAL-AI-GOVERNANCE/.github
          ref: 201113e1fdf92892ab8864abe8ae446bb2a9109b
          path: .gaig-shared-controls
          sparse-checkout: tools/check_history_privacy.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check reachable history privacy
        run: python3 -B .gaig-shared-controls/tools/check_history_privacy.py
      - name: Remove shared history-privacy control
        if: always()
        run: rm -rf -- .gaig-shared-controls

      - name: Validate foundations repository
        run: |
          python3 -B tools/validate_foundations.py

      - name: Run material-change and other unit tests
        run: |
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v
