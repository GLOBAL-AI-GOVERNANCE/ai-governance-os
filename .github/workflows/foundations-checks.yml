name: Foundations Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read

jobs:
  foundations-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check reachable history privacy
        run: python3 -B tools/check_history_privacy.py

      - name: Validate foundations repository
        run: |
          python3 -B tools/validate_foundations.py
